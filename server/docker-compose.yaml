name: 'brev.ly'

services:
  db:
    image: bitnami/postgresql:latest
    container_name: brevly_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: brevly
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker:/docker-entrypoint-initdb.d
    restart: unless-stopped
