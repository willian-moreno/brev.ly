name: server pipe

on:
  push:
    branches:
      - main
    paths:
      - "server/**"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v7

      # - name: setup nodejs
      #   id: setup_nodejs
      #   uses: actions/setup-node@v7
      #   with:
      #     node-version: 24

      # - name: setup pnpm
      #   id: setup_pnpm
      #   uses: pnpm/action-setup@v6
      #   with:
      #     version: 11

      # Nessa etapa seriam executados os testes.
      # Como é preciso um banco de dados, devido como os testes foram construídos, não é possível no momento.
      # - name: install dependencies
      #   id: install_dependencies
      #   run: |
      #     pnpm install

      - name: generate tag
        id: generate_tag
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: set up docker buildx
        id: set_up_docker_buildx
        uses: docker/setup-buildx-action@v4

      - name: build the image to scan with trivy
        id: build_to_scan_with_trivy
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/dockerfile
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:scan

      - name: run trivy vulnerability scanner
        id: run_trivy_vulnerability_scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ vars.DOCKERHUB_REPOSITORY }}:scan"
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: login to docker hub
        id: login_docker_hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: build and push the image to Docker Hub
      #   id: build_and_push
      #   env:
      #     DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      #     IMAGE_TAG: ${{ steps.generate_tag.outputs.sha }}
      #   run: |
      #     docker build -t $DOCKERHUB_REPOSITORY:$IMAGE_TAG .
      #     docker push $DOCKERHUB_REPOSITORY:$IMAGE_TAG

      - name: build and push the image to Docker Hub
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/dockerfile
          push: true
          cache-from: type=gha
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.generate_tag.outputs.sha }}
