name: build and push to docker hub server pipe

on:
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4

      - name: generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: login to docker hub
        id: login_docker_hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: build and push the image to Docker Hub
      #   id: build_and_push
      #   env:
      #     DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      #     IMAGE_TAG: ${{ steps.generate_tag.outputs.sha }}
      #   run: |
      #     docker build -t $DOCKERHUB_REPOSITORY:$IMAGE_TAG .
      #     docker push $DOCKERHUB_REPOSITORY:$IMAGE_TAG

      - name: build and push the image to Docker Hub
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.generate_tag.outputs.sha }}
